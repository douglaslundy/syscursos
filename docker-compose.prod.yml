services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: syscursos-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3002:3000"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.syscursos.rule=Host(`syscursos.circuitodascorridas.com.br`)
      - traefik.http.routers.syscursos.entrypoints=websecure
      - traefik.http.routers.syscursos.tls=true
      - traefik.http.routers.syscursos.tls.certresolver=letsencrypt
      - traefik.http.services.syscursos.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
